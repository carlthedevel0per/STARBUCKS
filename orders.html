<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ORDERS </title>
  <link rel="stylesheet" href="styles/orders.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,472;1,472&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
</head>
<body>

  <div class="orders-header">

    <div class="orders-left-header">
      <a href="home.html" class="link">
        <img src="Photos/starbucks.png" class="logo">
      </a>
    </div>

    <div class="orders-middle-header">
      <input type="text" placeholder="Search" class="input-box">
      <button class="search-button">
        <img src="Photos/search-icon.png" class="search-icon">
      </button>
    </div>

    <div class="orders-right-header">

      <a href="checkout.html" class="link cart-button">
        <img src="Photos/cart-icon.png" class="cart-icon" >
        <div class="cart-text"> 3 </div>
      </a>

    </div>

  </div>

  <div class="orders-first-text">
    <h1> YOUR ORDERS </h1>
  </div>

  <div class="ordered-item-container">

    <div class="order-details">

      <p> Order Placed:
         <i> Sep 20 </i> 
      </p>

      <p> Order Total: 
          <i> $100 </i>
      </p>

      <p> Order ID:
        <i> FDADFADAAASASG </i> 
      </p>

      <p> Delivery Date:
          <i> Sep 20 </i>
      </p>

      <div class="track-button">
        <button class="track-package-button">
          TRACK PACKAGE
        </button>
      </div>

    </div>

    <div class="ordered-item-details">

      <div class="each-ordered-item">
        <img src="Photos/churros_crema-removebg-preview.png" class="item-image">

        <div class="item-specific-details">
          <h3> Churros </h3>
          <p> <b> Quantity: </b> 1 </p>
         </div>

      </div>

      <div class="each-ordered-item">
        <img src="Photos/frappucino-removebg-preview.png" class="item-image">

        <div class="item-specific-details">
          <h3> Frappucino </h3>
          <p> <b> Quantity: </b> 2 </p>
        </div>

      </div>

    </div>

  </div>
  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> CHECKCOUT </title>
  <link rel="stylesheet" href="styles/checkout.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,472;1,472&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
</head>
<body>

  <div class="checkout-header">

    <div class="checkout-header-left-section">
      <a href="menu.html" class="link">
        <img src="Photos/starbucks.png" class="logo">
      </a>
    </div>

    <div class="checkout-header-middle-section">
      <h1> CHECKOUT (3) ITEMS </h1>
    </div>

    <div class="checkout-header-right-section">
      <a href="checkout.html" class="cart-button link">
        <img src="Photos/cart-icon.png" class="cart-icon">
        <div class="cart-text">
          <p> 3 </p>
        </div>
      </a>
    </div>

  </div>

  <div class="cart-item-grid">

    <div class="cart-item-container">

      <div class="cart-item-section">

        <div class="cart-item">
          <img src="Photos/churros_crema-removebg-preview.png" class="item-image">
        </div>

        <div class="cart-item-details">
          <h1> Churros </h1>
          <p> $100</p>
        </div>

      </div>

      <div class="cart-item-buttons">

        <p> Quantity: 2 </p>

        <button class="item-buttons">
          UPDATE
        </button>

        <button class="item-buttons">
          DELETE
        </button>

      </div>

    </div>

    <div class="cart-item-container">

      <div class="cart-item-section">

        <div class="cart-item">
          <img src="Photos/frappucino-removebg-preview.png" class="item-image">
        </div>

        <div class="cart-item-details">
          <h1> Frappucino </h1>
          <p> $100</p>
        </div>

      </div>

      <div class="cart-item-buttons">

        <p> Quantity: 1 </p>

        <button class="item-buttons">
          UPDATE
        </button>

        <button class="item-buttons">
          DELETE
        </button>

      </div>

    </div>
  
  </div>

  <div class="place-order-section">
    <a href="orderSummary.html">
      DO YOU WANT TO CHECKOUT THIS ITEMS?
    </a>
  </div>
  
</body>
</html>

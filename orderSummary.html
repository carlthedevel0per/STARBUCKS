<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> ORDER SUMMARY </title>
  <link rel="stylesheet" href="styles/orderSummary.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,472;1,472&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
</head>
<body>

  <div class="order-summary-header">

    <img src="Photos/starbucks.png" class="logo">
    <img src="Photos/starbucks.png" class="logo">
    <img src="Photos/starbucks.png" class="logo">
    <img src="Photos/starbucks.png" class="logo">
    <img src="Photos/starbucks.png" class="logo">
    
  </div>

  <div class="view-orders-button">
    <a href="">
      VIEW ORDERS
    </a>
  </div>

  <div class="order-summary-main-container">

    <div class="delivery-option-section">

      <h1 class="delivery-header"> Choose a delivery date: </h1>

      <div class="delivery-option-container">

        <div class="delivery-option">
          <input type="radio" name="option" id="option1">
          <label for="option1"> Monday, Sep 12 </label>
          <p> $5.99 </p>
        </div>

        <div class="delivery-option">
          <input type="radio" name="option" id="option2">
          <label for="option2"> Wednesday, Sep 14 </label>
          <p> $2.99 </p>
        </div>

        <div class="delivery-option">
          <input type="radio" name="option" id="option3">
          <label for="option3"> Monday, Sep 19 </label>
          <p> Free </p>
        </div>

      </div>

    </div>

    <div class="order-summary-section">

      <h1 class="summary-header"> Order Summary: </h1>

      <div class="order-summary-container">

        <div class="order-summary-category">

          <p class="summary-category"> Items(3): </p>

          <p class="summary-category"> Shipping fee: </p>

          <p class="summary-category"> Total before Tax: </p>

          <p class="summary-category"> Tax (10%): </p>

          <p class="summary-category"> Overall total: </p>

        </div>

        <div class="order-summary-prices">

          <p class="summary-prices"> $100 </p>

          <p class="summary-prices"> $100 </p>

          <p class="summary-prices"> $100 </p>

          <p class="summary-prices"> $100 </p>

          <p class="summary-prices"> $100 </p>
        </div>

      </div>

      <div class="order-button">

        <button class="place-order-button">
          PLACE ORDER
        </button>

      </div>

    </div>

  </div>

  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> TRACKING </title>
  <link rel="stylesheet" href="styles/tracking.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,472;1,472&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
</head>
<body>

  <div class="tracking-header">

    <div class="tracking-right-header">
      <a href="home.html" class="link">
        <img src="Photos/starbucks.png" class="logo">
      </a>
    </div>

    <div class="tracking-left-header">
      <a href="checkout.html" class="link cart-button">
        <img src="Photos/cart-icon.png" class="cart-icon">
        <div class="cart-text"> 3 </div>
      </a>
    </div>

  </div>

  <div class="tracking-main-container">

    <div class="truck-section">
      <img src="Photos/map.jpg" class="map-icon">
      <h1> WAITING FOR COURIER </h1>
    </div>

    <div class="tracking-item-details">

      <div class="each-tracking-item">
        <img src="Photos/churros_crema-removebg-preview.png" class="item-image">

        <div class="item-specific-details"> 
          <h3> Churros </h3>
          <p> Quantity: 1</p>
        </div>
        
      </div>

      <div class="each-tracking-item">
        <img src="Photos/frappucino-removebg-preview.png" class="item-image">

        <div class="item-specific-details">
          <h3> Frappucino </h3>
          <p> Quantity: 2 </p>
        </div>
        
      </div>

    </div>



  </div>


  
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> MENU </title>
  <link rel="stylesheet" href="styles/menu.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,472;1,472&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/acbc1a7e56.js" crossorigin="anonymous"></script>
</head>
<body>

  <div class="menu-header">

    <div class="menu-header-left-section">
      <a href="home.html" class="link">
          <img src="Photos/starbucks.png" class="image-icon logo">
      </a>
    </div>

    <div class="menu-header-middle-section">
      <input type="text" placeholder="Search" class="input-box">
      <button class="search-button">
        <img src="Photos/search-icon.png" class="search-icon">
      </button>
    </div>

    <div class="menu-header-right-section">

      <div class="orders">
        <a href="" class="link">
          <p> ORDERS </p>
        </a>
      </div>

      <div class="cart-group">
        <a href="checkout.html" class="link cart-button">
          <img src="Photos/cart-icon.png" class="cart-icon">
          <div class="cart-text"> 3 </div>
        </a>
      </div>

    </div>

  </div>

  <main>

    <div>
        <h1 id="menu_header"> MENU </h1>
    </div>
    
    <h1 class="category"> DRINKS </h1>
    <div class="second_section">
        <div class="menu_boxes">
            <img src="Photos/creamy_frappucino-removebg-preview.png" type="image/png" alt="Creamy Frappucino">
            <p class="item-name"> Creamy Frappucino </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>

        </div>

        <div class="menu_boxes">
            <img src="Photos/matcha_latte-removebg-preview.png" type="image/png" alt="Matcha Latte">
            <p class="item-name"> Matcha Latte</p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>

        <div class="menu_boxes">
            <img src="Photos/frappucino-removebg-preview.png" type="image/png" alt="Frappucino">
            <p class="item-name"> Frappucino </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>

        <div class="menu_boxes">
            <img src="Photos/creamy_latte-removebg-preview.png" type="image/png" alt="Creamy Latte">
            <p class="item-name"> Creamy Latte </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>
    </div>

    <h1 class="category"> FOODS </h1>
    <div class="third_section">
        <div class="menu_boxes">
            <img src="Photos/mocha_donut-removebg-preview.png" type="image/png" alt="Mocha Donut">
            <p class="item-name"> Mocha Donut </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>

        <div class="menu_boxes">
            <img src="Photos/pasta_alla_rosa-removebg-preview.png" type="image/png" alt="Pasta Alla Rosa">
            <p class="item-name"> Pasta Alla Rosa </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>

        <div class="menu_boxes">
            <img src="Photos/toffee_oat_cookie-removebg-preview.png" type="image/png" alt="Toffee Oat Cookie">
            <p class="item-name"> Toffee Oat Cookie</p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>

        <div class="menu_boxes">
            <img src="Photos/churros_crema-removebg-preview.png" type="image/png" alt="Churros Crema">
            <p class="item-name"> Churros </p>

            <div class="menu-info">
              <p class="price"> $100 </p>
              <button class="add-to-cart">
                Add to Cart
              </button>
            </div>
        </div>
    </div>

  </main>

  <footer id="Contacts">
      <div class="copyright">
          <p> &copy; 2026 CarlTheDeveloper </p>
      </div>

      <div class="contacts_icon">
          <a href="facebook.com" target="_blank">
              <i class="fa-brands fa-facebook fa-2x"></i>
          </a>
      </div>

      <div class="contacts_icon">
          <a href="instagram.com" target="_blank">
              <i class="fa-brands fa-instagram fa-2x"></i>
          </a>
      </div>

      <div class="contacts_icon">
          <a href="tiktok.com" target="_blank">
              <i class="fa-brands fa-tiktok fa-2x"></i>
          </a>
      </div>
  </footer>

  
  
</body>
</html>
